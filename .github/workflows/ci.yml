name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: yarn install --immutable
      - run: yarn fmt:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
      - run: yarn publint
      - run: yarn test --run
